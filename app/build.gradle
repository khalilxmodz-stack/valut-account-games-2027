plugins {
    id 'com.android.application'
}

android {
    namespace 'com.khalilxmodz.myapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.khalilxmodz.myapp'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // No native (.so) libraries are used, so the APK runs on armeabi-v7a and arm64-v8a
    // (and every other ABI) without any abiFilters.
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
